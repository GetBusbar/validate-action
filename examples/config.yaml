# Minimal valid Busbar config — references the anthropic provider from the baked-in catalog.
# busbar 1.5.0+ syntax: provider credentials are a secret reference (api_key: { env: ... }),
# not the retired api_key_env: shorthand.
models:
  claude:
    provider: anthropic
    max_concurrent: 20
    max_requests: -1
providers:
  anthropic:
    api_key: { env: ANTHROPIC_KEY }
