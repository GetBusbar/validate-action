# Minimal valid Busbar config — references the anthropic provider from the baked-in catalog.
# Uses the api_key_env: shorthand, which is what the currently-published getbusbar/busbar
# image (latest = 1.4.1 as of this writing) actually accepts. busbar 1.5.0 introduces a
# secret-reference form (api_key: { env: ... }) but has not been released/published to
# Docker Hub yet — see .github/workflows/test.yml and self-heal.yml for how this repo
# tracks that transition without hardcoding a version here.
models:
  claude:
    provider: anthropic
    max_concurrent: 20
    max_requests: -1
providers:
  anthropic:
    api_key_env: ANTHROPIC_KEY
