name: test
on:
  push:
  pull_request:
jobs:
  # examples/config.yaml uses 1.5.0 config syntax (api_key: { env } etc, see the 1.4.x->1.5.0
  # migration guide). busbar 1.5.0 shipped 2026-08-01 and is published to Docker Hub, so both
  # jobs pin `version: "1.5.0"` for reproducibility (the plan the old TODO here described).
  # self-heal.yml separately exercises `latest` daily, so schema drift in a future release is
  # still caught without unpinning these.
  valid-config-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valid config should pass
        uses: ./
        with:
          config: examples/config.yaml
          version: "1.5.0"

  invalid-config-fails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write an invalid config
        run: |
          cat > bad.yaml <<'EOF'
          models:
            broken:
              provider: this-provider-does-not-exist
              max_concurrent: 1
              max_requests: -1
          providers:
            this-provider-does-not-exist: {}
          EOF
      - name: Invalid config should fail the action
        id: run
        continue-on-error: true
        uses: ./
        with:
          config: bad.yaml
          version: "1.5.0"
      - name: Assert the action reported failure
        run: |
          if [ "${{ steps.run.outcome }}" != "failure" ]; then
            echo "expected the action to fail on an invalid config, got '${{ steps.run.outcome }}'"
            exit 1
          fi
          echo "ok: invalid config correctly failed"
